name: Restore SeBa website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore website files
        shell: bash
        run: |
          rm -rf restored dist
          mkdir -p restored dist
          unzip -q -o cip-snapshot-01.zip -d restored

          if [ -d "restored/dist" ]; then
            cp -a restored/dist/. dist/
          else
            index_file="$(find restored -type f -name index.html | head -n 1)"
            if [ -z "$index_file" ]; then
              echo "No index.html found in cip-snapshot-01.zip"
              exit 1
            fi
            root_dir="$(dirname "$index_file")"
            cp -a "$root_dir"/. dist/
          fi

          test -f dist/index.html
          echo "Restored $(find dist -type f | wc -l) website files."

      - name: Commit restored website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Restore SeBa website into dist"
            git push
          fi
