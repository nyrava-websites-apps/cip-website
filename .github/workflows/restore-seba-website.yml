name: Restore SeBa website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore website files
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf restored dist
          mkdir -p restored dist
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile("cip-snapshot-01.zip") as archive:
              print("Archive entries:", len(archive.namelist()))
              archive.extractall("restored")
          PY

          if [ -d "restored/dist" ]; then
            cp -a restored/dist/. dist/
          else
            cp -a restored/. dist/
          fi

          if [ ! -f dist/index.html ]; then
            target="$(find dist -type f -path '*/index.html' | sort | head -n 1)"
            if [ -n "$target" ]; then
              target="/${target#dist/}"
              cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=$target">
            <title>Grupo CIP</title>
          </head>
          <body>
            <p><a href="$target">Entrar al sitio Grupo CIP</a></p>
          </body>
          </html>
          EOF
            else
              echo "No HTML entry point found in snapshot"
              find dist -maxdepth 4 -type f | head -n 100
              exit 1
            fi
          fi

          test -f dist/index.html
          echo "Restored $(find dist -type f | wc -l) website files."

      - name: Commit restored website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Restore SeBa website into dist"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
